version: '3.8'
services:
    web:
        image: php:7.4-apache
        ports:
            - "8080:80"
        volumes:
            - ./www:/var/www/html

    db:
        image: mysql:5.7
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: testdb

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        ports:
            - "8081:80"
        environment:
            PMA_HOST: db
